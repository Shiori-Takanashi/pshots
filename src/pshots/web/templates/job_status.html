<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <title>ジョブステータス</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        function fetchStatus() {
            $.getJSON("{{ url_for('web.job_status', job_id=job_id) }}", function (data) {
                $("#status").html(data.status + "<br>" + data.progress);
                if (!data.done) {
                    setTimeout(fetchStatus, 1000);
                } else {
                    $("#status").append("<br><strong>処理完了！</strong>");
                }
            });
        }
        $(document).ready(function () {
            fetchStatus();
        });
    </script>
</head>

<body class="container py-4">
    <h1>ジョブステータス</h1>
    <div id="status" class="alert alert-info">ステータス取得中…</div>
    <a href="{{ url_for('web.index') }}" class="btn btn-secondary">トップに戻る</a>
</body>

</html>
